<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Soko Market Tracker</title>
<style>
:root{--bg:#f3f1ea;--card:#fffdf8;--text:#1b2a24;--muted:#6a766f;--line:#ddd8cb;--up:#0b7a43;--down:#c23b2e;--accent:#14573d}
@media(prefers-color-scheme:dark){:root{--bg:#101612;--card:#18211b;--text:#e9efe9;--muted:#8a978f;--line:#26332b;--up:#4fd18b;--down:#ff7a6b;--accent:#6fcf9f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 Georgia,"Times New Roman",serif}
h1,h2,button,input,select,.num,.tabs{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:18px 16px 6px;max-width:720px;margin:auto}
h1{font-size:24px;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:14px;margin:2px 0 0}
.tabs{display:flex;gap:6px;max-width:720px;margin:12px auto 0;padding:0 16px}
.tabs button{flex:1;padding:10px;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:8px;font-size:15px}
.tabs button.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
main{max-width:720px;margin:auto;padding:12px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.name{font-weight:600}.sym{color:var(--muted);font-size:13px}
.num{font-variant-numeric:tabular-nums;text-align:right}
.up{color:var(--up)}.down{color:var(--down)}
.grp{font-family:system-ui,sans-serif;font-size:14px;color:var(--muted);margin:16px 0 8px}
canvas{width:100%!important;height:220px!important}
input,select{width:100%;padding:11px;margin:5px 0;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font-size:16px}
.btn{padding:11px 14px;border:0;border-radius:8px;background:var(--accent);color:var(--bg);font-size:15px;width:100%;margin-top:6px}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);width:auto;padding:6px 10px;margin:0;font-size:13px}
.msg{color:var(--muted);font-size:14px;font-family:system-ui,sans-serif}
.hide{display:none}
a{color:var(--accent)}
</style>
</head>
<body>
<header>
  <h1>Soko</h1>
  <p class="sub">Nairobi stocks and global commodities. Prices refresh every 15 minutes.</p>
</header>
<div class="tabs">
  <button id="t1" class="on" onclick="tab(1)">Market</button>
  <button id="t2" onclick="tab(2)">My portfolio</button>
</div>
<main>
  <section id="p1">
    <div id="chartCard" class="card hide">
      <div class="row"><div><div class="name" id="cTitle"></div><div class="sym" id="cSub"></div></div>
      <button class="btn ghost" onclick="$('chartCard').classList.add('hide')">Close</button></div>
      <canvas id="chart"></canvas>
    </div>
    <div id="list" class="msg">Loading prices…</div>
  </section>

  <section id="p2" class="hide">
    <div id="auth" class="card">
      <div class="name">Sign in to track your holdings</div>
      <input id="em" type="email" placeholder="Email" autocomplete="email">
      <input id="pw" type="password" placeholder="Password (6+ characters)" autocomplete="current-password">
      <button class="btn" onclick="signIn()">Sign in</button>
      <button class="btn" style="background:transparent;color:var(--accent);border:1px solid var(--accent)" onclick="signUp()">Create account</button>
      <p class="msg" id="authMsg"></p>
    </div>
    <div id="pf" class="hide">
      <div class="card" id="totals"></div>
      <div class="card">
        <div class="name">Add a holding</div>
        <select id="hi"></select>
        <input id="hq" type="number" step="any" placeholder="Quantity">
        <input id="hp" type="number" step="any" placeholder="Buy price per unit">
        <button class="btn" onclick="addHolding()">Save holding</button>
        <p class="msg" id="hMsg"></p>
      </div>
      <div id="holdings"></div>
      <button class="btn ghost" onclick="signOut()">Sign out</button>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script>
// 1) PASTE YOUR VALUES HERE (publishable/anon key only, never the secret key)
const SUPABASE_URL = "https://inugsmnlodvfsbkpxuyb.supabase.co";
const SUPABASE_KEY = "sb_publishable_cj84eL5811FNFUBZ-xtAXw_5A7-w4KX";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const fmt = n => Number(n).toLocaleString(undefined, {maximumFractionDigits: 2});
let items = [], prices = {}, chart = null, user = null;

function tab(n){
  $('p1').classList.toggle('hide', n !== 1);
  $('p2').classList.toggle('hide', n !== 2);
  $('t1').classList.toggle('on', n === 1);
  $('t2').classList.toggle('on', n === 2);
}

async function loadMarket(){
  const {data, error} = await sb.from('instruments').select('*').order('type').order('symbol');
  if (error){ $('list').textContent = 'Could not load: ' + error.message; return; }
  items = data;
  await Promise.all(items.map(async i => {
    const r = await sb.from('prices').select('price,fetched_at')
      .eq('instrument_id', i.id).order('fetched_at', {ascending:false}).limit(100);
    prices[i.id] = r.data || [];
  }));
  renderList();
  $('hi').innerHTML = items.map(i => `<option value="${i.id}">${i.name} (${i.symbol})</option>`).join('');
  if (user) loadHoldings();
}

function change(i){
  const p = prices[i.id];
  if (!p || p.length < 2) return null;
  return (p[0].price - p[p.length-1].price) / p[p.length-1].price * 100;
}

function renderList(){
  const groups = {stock:'Nairobi stocks', commodity:'Commodities'};
  let html = '';
  for (const t of ['stock','commodity']){
    html += `<div class="grp">${groups[t]}</div>`;
    for (const i of items.filter(x => x.type === t)){
      const p = prices[i.id] || [], c = change(i);
      html += `<div class="card" style="cursor:pointer" onclick="showChart(${i.id})">
        <div class="row"><div><div class="name">${i.name}</div><div class="sym">${i.symbol}</div></div>
        <div class="num"><div>${p.length ? fmt(p[0].price) : 'No data'}</div>
        <div class="${c >= 0 ? 'up' : 'down'}" style="font-size:13px">${c === null ? '' : (c >= 0 ? '+' : '') + c.toFixed(2) + '%'}</div></div></div></div>`;
    }
  }
  $('list').className = '';
  $('list').innerHTML = html;
}

function showChart(id){
  const i = items.find(x => x.id === id), p = [...prices[id]].reverse();
  $('chartCard').classList.remove('hide');
  $('cTitle').textContent = i.name;
  $('cSub').textContent = p.length ? 'Last ' + p.length + ' updates' : 'No data yet';
  const css = getComputedStyle(document.documentElement);
  if (chart) chart.destroy();
  chart = new Chart($('chart'), {
    type:'line',
    data:{labels:p.map(x => new Date(x.fetched_at).toLocaleString([], {day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})),
      datasets:[{data:p.map(x => x.price), borderColor:css.getPropertyValue('--accent').trim(), pointRadius:0, borderWidth:2, tension:.25}]},
    options:{plugins:{legend:{display:false}}, maintainAspectRatio:false,
      scales:{x:{ticks:{maxTicksLimit:4, color:css.getPropertyValue('--muted').trim()}, grid:{display:false}},
              y:{ticks:{color:css.getPropertyValue('--muted').trim()}}}}
  });
  window.scrollTo({top:0, behavior:'smooth'});
}

// ---------- accounts ----------
async function signUp(){
  const {error} = await sb.auth.signUp({email:$('em').value.trim(), password:$('pw').value});
  $('authMsg').textContent = error ? error.message : 'Account created. Check your email to confirm if asked, then sign in.';
}
async function signIn(){
  const {error} = await sb.auth.signInWithPassword({email:$('em').value.trim(), password:$('pw').value});
  if (error) $('authMsg').textContent = error.message;
}
async function signOut(){ await sb.auth.signOut(); }

sb.auth.onAuthStateChange((_e, session) => {
  user = session ? session.user : null;
  $('auth').classList.toggle('hide', !!user);
  $('pf').classList.toggle('hide', !user);
  if (user) loadHoldings();
});

// ---------- holdings ----------
async function loadHoldings(){
  const {data, error} = await sb.from('holdings').select('*').order('bought_at', {ascending:false});
  if (error){ $('holdings').textContent = error.message; return; }
  let invested = 0, value = 0, html = '';
  for (const h of data){
    const i = items.find(x => x.id === h.instrument_id); if (!i) continue;
    const now = prices[i.id] && prices[i.id][0] ? Number(prices[i.id][0].price) : Number(h.buy_price);
    const cost = h.quantity * h.buy_price, val = h.quantity * now, pl = val - cost;
    invested += cost; value += val;
    html += `<div class="card"><div class="row"><div><div class="name">${i.name}</div>
      <div class="sym">${fmt(h.quantity)} units at ${fmt(h.buy_price)}</div></div>
      <div class="num"><div>${fmt(val)}</div>
      <div class="${pl >= 0 ? 'up' : 'down'}" style="font-size:13px">${pl >= 0 ? '+' : ''}${fmt(pl)} (${(pl/cost*100).toFixed(1)}%)</div></div></div>
      <button class="btn ghost" style="margin-top:8px" onclick="delHolding(${h.id})">Remove</button></div>`;
  }
  $('holdings').innerHTML = html || '<p class="msg">No holdings yet. Add your first one above.</p>';
  const tot = value - invested;
  $('totals').innerHTML = `<div class="row"><div><div class="sym">Portfolio value</div><div class="name num" style="font-size:22px">${fmt(value)}</div></div>
    <div class="num"><div class="sym">Total profit/loss</div><div class="${tot >= 0 ? 'up' : 'down'} name">${tot >= 0 ? '+' : ''}${fmt(tot)}</div></div></div>`;
}
async function addHolding(){
  const q = parseFloat($('hq').value), p = parseFloat($('hp').value);
  if (!(q > 0) || !(p > 0)){ $('hMsg').textContent = 'Enter a quantity and a buy price above 0.'; return; }
  const {error} = await sb.from('holdings').insert({instrument_id: +$('hi').value, quantity:q, buy_price:p});
  $('hMsg').textContent = error ? error.message : 'Saved.';
  if (!error){ $('hq').value = ''; $('hp').value = ''; loadHoldings(); }
}
async function delHolding(id){ await sb.from('holdings').delete().eq('id', id); loadHoldings(); }

loadMarket();
setInterval(loadMarket, 5 * 60 * 1000);
</script>
</body>
</html>
